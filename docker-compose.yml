services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://careeros:careeros@db:5432/careeros
    depends_on: [db]
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://careeros:careeros@db:5432/careeros
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
    volumes: [careeros_data:/var/lib/postgresql/data]
volumes:
  careeros_data:
