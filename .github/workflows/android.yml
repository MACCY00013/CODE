name: Android Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: careeros-debug-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk}
